version: '3'

tasks:
  default:
    cmds:
      - bash scripts/verify.sh

  lint:
    desc: Run shell and source checks
    cmds:
      - bash scripts/lint.sh

  test:
    desc: Run Swift XCTest on macOS
    cmds:
      - bash scripts/test.sh

  build:
    desc: Compile macoc with SwiftPM
    cmds:
      - bash scripts/build.sh

  icon:
    desc: Convert the icon source into an Apple .icns file
    cmds:
      - bash scripts/icon.sh

  sign:
    desc: Sign the existing app bundle
    cmds:
      - bash scripts/sign.sh

  bundle:
    desc: Build a signed macoc.app
    cmds:
      - bash scripts/bundle.sh

  install:
    desc: Build, install to ~/Applications and launch
    cmds:
      - bash scripts/install.sh

  doctor:
    desc: Inspect keyboard services through native IOKit
    cmds:
      - bash scripts/doctor.sh

  clean:
    desc: Remove SwiftPM and packaged outputs
    cmds:
      - bash scripts/clean.sh

  verify:
    desc: Run all available checks
    cmds:
      - bash scripts/verify.sh

  package:
    desc: Build a release zip and SHA-256 checksum
    cmds:
      - bash scripts/package.sh

  signing-setup:
    desc: Instructions for creating a stable local signing identity
    cmds:
      - bash scripts/setup-signing.sh

  publish:
    desc: Publish dist/ zip to Forgejo (requires FORGEJO_TOKEN)
    cmds:
      - bash scripts/publish-release.sh
